# Fresh, source-built Synology deployment. Docker-managed volumes keep application
# data independent of DSM shared-folder ACLs on the source checkout.
name: bambuddy-synology

services:
  bambuddy:
    image: bambuddy:anycubic-https-testing
    build: .
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s
    # Share the Linux host's interfaces so discovery reads their real netmasks.
    # Bind the app to the configured address/port to avoid DSM port conflicts.
    network_mode: host
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOST: ${BAMBUDDY_BIND_ADDRESS:-127.0.0.1}
      PORT: ${BAMBUDDY_HTTPS_PORT:-18443}
      BAMBUDDY_HTTPS: "true"
      BAMBUDDY_HTTPS_HOSTNAMES: ${BAMBUDDY_HTTPS_HOSTNAMES:-${BAMBUDDY_BIND_ADDRESS:-127.0.0.1}}
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs

volumes:
  bambuddy_data:
  bambuddy_logs:
