# Source-built Synology upgrade using existing application data and log volumes.
# Missing volumes fail startup instead of creating an empty installation.
name: bambuddy-synology

services:
  bambuddy:
    image: ${BAMBUDDY_IMAGE:-bambuddy:printer-modularization-https}
    build: .
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s
    # Preserve discovery's view of the NAS interfaces and actual netmasks.
    # The web listener binds only the explicitly configured address/port.
    network_mode: host
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOST: ${BAMBUDDY_BIND_ADDRESS:?Set BAMBUDDY_BIND_ADDRESS to the NAS LAN address}
      PORT: ${BAMBUDDY_HTTPS_PORT:-18443}
      BAMBUDDY_HTTPS: "true"
      BAMBUDDY_HTTPS_HOSTNAMES: ${BAMBUDDY_HTTPS_HOSTNAMES:-${BAMBUDDY_BIND_ADDRESS}}
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs

volumes:
  bambuddy_data:
    external: true
    name: ${BAMBUDDY_DATA_VOLUME:-bambuddy-synology_bambuddy_data}
  bambuddy_logs:
    external: true
    name: ${BAMBUDDY_LOGS_VOLUME:-bambuddy-synology_bambuddy_logs}
